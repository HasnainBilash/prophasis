name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  # Runs the graph engine and the panel inside a real VS Code (downloaded by
  # the test runner, with the Python extension), on a virtual display.
  integration:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ubuntu 24.04 blocks the sandbox Electron apps (VS Code) use; allow it
      # on this throwaway runner so the test copy of VS Code can start.
      - name: Allow the Electron sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Engine check (TypeScript, JavaScript, Python)
        run: xvfb-run -a npm run check:engine
      - name: Panel check
        run: xvfb-run -a npm run check:panel
      - name: Keep results when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: .vscode-test/results/
