<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0b1020" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <!-- arrows from the start card to two callees -->
  <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.92">
    <path d="M100 128 C 132 128, 128 80, 150 80"/>
    <path d="M100 128 C 132 128, 128 176, 150 176"/>
  </g>
  <g fill="#ffffff">
    <path d="M150 70 L 166 80 L 150 90 z"/>
    <path d="M150 166 L 166 176 L 150 186 z"/>
  </g>
  <!-- cards -->
  <g filter="url(#soft)">
    <rect x="34" y="100" width="66" height="56" rx="12" fill="#ffffff"/>
    <rect x="164" y="56" width="62" height="48" rx="11" fill="#ffffff"/>
    <rect x="164" y="152" width="62" height="48" rx="11" fill="#ffffff"/>
  </g>
  <!-- kind stripes and name lines -->
  <rect x="34" y="100" width="9" height="56" rx="4" fill="#a78bfa"/>
  <rect x="164" y="56" width="8" height="48" rx="4" fill="#38bdf8"/>
  <rect x="164" y="152" width="8" height="48" rx="4" fill="#fbbf24"/>
  <g fill="#c7d2fe">
    <rect x="52" y="116" width="36" height="8" rx="4"/>
    <rect x="52" y="132" width="24" height="7" rx="3.5"/>
    <rect x="180" y="70" width="34" height="7" rx="3.5"/>
    <rect x="180" y="84" width="22" height="6" rx="3"/>
    <rect x="180" y="166" width="34" height="7" rx="3.5"/>
    <rect x="180" y="180" width="22" height="6" rx="3"/>
  </g>
  <!-- order badges -->
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">
    <circle cx="128" cy="96" r="13" fill="#1e1b4b"/>
    <text x="128" y="102" fill="#ffffff">1</text>
    <circle cx="128" cy="160" r="13" fill="#1e1b4b"/>
    <text x="128" y="166" fill="#ffffff">2</text>
  </g>
</svg>
